<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#B34760">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<link rel="manifest" href="manifest.webmanifest">
<title>مدیریت سالن ناخن</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap">
<style>
  :root{
    --bg:#FBF5F2; --card:#FFFFFF; --primary:#B34760; --primary-dark:#8C3349;
    --gold:#C79A4B; --text:#3B2A2E; --muted:#8A7377; --border:#F0E2DF;
    --success:#4C8C6B; --pending:#C79A4B; --danger:#B23A48;
    --shadow: 0 4px 18px rgba(140,51,73,0.08);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{ font-family:'Vazirmatn', Tahoma, sans-serif; font-size:16px; background: var(--bg); color: var(--text);
    min-height:100vh; display:flex; justify-content:center; padding: 18px 10px 40px; }
  html{ -webkit-text-size-adjust:100%; text-size-adjust:100%; }
  input,button,select,textarea{ font-family:inherit; }
  @media (display-mode: standalone){
    body{ padding:0; }
    .phone{ max-width:none; width:100%; height:100dvh; min-height:100dvh; max-height:none; border-radius:0; border:0; box-shadow:none; }
    main{ padding-bottom:calc(90px + env(safe-area-inset-bottom)); }
    nav.bottom{ padding-bottom:env(safe-area-inset-bottom); }
    header.top{ padding-top:calc(22px + env(safe-area-inset-top)); }
    header.top h1{ font-size:21px; }
    body{ font-size:16px; }
    header.top p{ font-size:14px; }
    .section-title{ font-size:16px; }
    .name{ font-size:15px; }
    .sub,.muted{ font-size:14.5px; }
    input,select,textarea{ font-size:15px !important; }
    .btn{ font-size:14px !important; }
    .chip{ font-size:13px; }
    .badge{ font-size:12px; }
    nav.bottom .tlabel{ font-size:12px; }
  }
  @media (max-width:380px){
    .phone{ min-height:0; }
    main{ padding-left:12px; padding-right:12px; }
  }
  .phone{ width:100%; max-width:430px; height:calc(100vh - 36px); min-height:680px; max-height:920px; background: var(--card); border-radius: 28px; box-shadow: var(--shadow);
    overflow:hidden; border:1px solid var(--border); display:flex; flex-direction:column; position:relative; }
  header.top{ background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%); color:#fff;
    padding: 22px 20px 18px; }
  header.top h1{ font-size:19px; font-weight:800; }
  header.top p{ font-size:12.5px; opacity:.85; margin-top:3px; }
  .swatches{ display:flex; gap:6px; margin-top:14px; }
  .swatches span{ width:16px; height:16px; border-radius:50%; display:inline-block; box-shadow: 0 0 0 2px rgba(255,255,255,.35); }
  main{ flex:1; overflow-y:auto; padding: 16px 16px 90px; }
  .section-title{ font-size:14.5px; font-weight:700; margin: 4px 0 10px; display:flex; align-items:center; justify-content:space-between; }
  .muted{ color:var(--muted); font-size:13.5px; }
  .card{ background:#fff; border:1px solid var(--border); border-radius:16px; padding:14px; margin-bottom:10px; box-shadow: var(--shadow); }
  .stat-row{ display:flex; gap:10px; margin-bottom:12px; }
  .stat{ flex:1; background: #fff; border:1px solid var(--border); border-radius:16px; padding:12px 8px; text-align:center; }
  .stat .num{ font-size:19px; font-weight:800; color:var(--primary-dark); }
  .stat .lbl{ font-size:11px; color:var(--muted); margin-top:2px;}
  .alert-card{ display:flex; justify-content:space-between; align-items:center; padding:12px 14px; border-radius:14px; margin-bottom:8px; cursor:pointer; border:1px solid var(--border); }
  .alert-card.mid{ background:#FCF3E9; }
  .alert-card.hot{ background:#FBEAEC; }
  .alert-card .n{ font-weight:800; font-size:16px; }
  .empty{ text-align:center; padding: 30px 10px; color:var(--muted); font-size:13px; }
  .empty .big{ font-size:32px; margin-bottom:6px; }
  .btn{ background: var(--primary); color:#fff; border:none; border-radius:12px; padding:10px 16px; font-family:inherit;
    font-size:13px; font-weight:700; cursor:pointer; transition:.15s; }
  .btn:hover{ background: var(--primary-dark); }
  .btn.ghost{ background:transparent; color:var(--primary); border:1.5px solid var(--primary); }
  .btn.small{ padding:6px 10px; font-size:11.5px; border-radius:9px; }
  .fab{ position:absolute; bottom:78px; left:16px; width:50px; height:50px; border-radius:50%; background: var(--primary);
    color:#fff; border:none; font-size:24px; box-shadow:0 6px 16px rgba(140,51,73,.35); cursor:pointer;
    display:flex; align-items:center; justify-content:center; z-index:5; }
  .list-item{ display:flex; justify-content:space-between; align-items:center; padding:11px 4px; border-bottom:1px solid var(--border); gap:8px; }
  .list-item:last-child{ border-bottom:none; }
  .avatar{ width:36px;height:36px;border-radius:50%; background: linear-gradient(135deg, var(--gold), var(--primary));
    color:#fff; font-weight:700; font-size:13px; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .row{ display:flex; align-items:center; gap:10px; min-width:0; }
  .name{ font-size:13.5px; font-weight:700; }
  .sub{ font-size:13px; color:var(--muted); margin-top:2px; }
  .badge{ font-size:10.5px; font-weight:700; padding:3px 9px; border-radius:20px; white-space:nowrap; }
  .badge.upcoming{ background:#FCEEE6; color: var(--gold); }
  .badge.done{ background:#E7F3EC; color: var(--success); }
  .badge.cancelled{ background:#F6E7E9; color: var(--danger); text-decoration:line-through; }
  .badge.days-ok{ background:#EFF6EE; color:var(--success); }
  .badge.days-mid{ background:#FCF3E9; color:var(--gold); }
  .badge.days-hot{ background:#FBEAEC; color:var(--danger); }
  input, select, textarea{ width:100%; font-family:inherit; padding:10px 12px; border:1.5px solid var(--border);
    border-radius:10px; font-size:13px; background:#fff; color:var(--text); outline:none; }
  input:focus, select:focus, textarea:focus{ border-color: var(--primary); }
  label{ font-size:12px; font-weight:600; color:var(--muted); display:block; margin:10px 0 4px; }
  .modal-overlay{ position:fixed; inset:0; background:rgba(59,42,46,.45); display:none; align-items:flex-end; justify-content:center; z-index:50; }
  .modal-overlay.open{ display:flex; }
  .modal{ background:#fff; width:100%; max-width:430px; border-radius:22px 22px 0 0; padding:20px 20px 26px; max-height:85vh; overflow-y:auto; }
  .modal h3{ font-size:15.5px; margin-bottom:4px; }
  .modal-actions{ display:flex; gap:8px; margin-top:18px; }
  .modal-actions .btn{ flex:1; }
  nav.bottom{ position:absolute; bottom:0; left:0; right:0; height:66px; background:#fff; border-top:1px solid var(--border); display:flex; z-index:20; }
  nav.bottom button{ position:relative; flex:1; background:none; border:none; padding:9px 4px 11px;
    display:flex; flex-direction:column; align-items:center; gap:3px; color:var(--muted); cursor:pointer; font-family:inherit; }
  nav.bottom button.active{ color: var(--primary); }
  nav.bottom svg{ width:21px; height:21px; }
  nav.bottom .tlabel{ font-size:10.5px; font-weight:600; }
  .nav-dot{ position:absolute; top:6px; right:calc(50% - 17px); width:7px; height:7px; border-radius:50%; background:var(--danger); display:none; box-shadow:0 0 0 2px #fff; }
  .nav-dot.show{ display:block; }
  .more-item{ display:flex; align-items:center; gap:12px; padding:13px 4px; border-bottom:1px solid var(--border); cursor:pointer; }
  .customer-picker{position:relative;} .customer-picker-results{position:absolute;top:100%;left:0;right:0;background:#fff;border:1px solid var(--border);border-radius:12px;max-height:220px;overflow-y:auto;z-index:30;box-shadow:var(--shadow);display:none;} .customer-picker-results.open{display:block;} .customer-option{padding:10px 12px;border-bottom:1px solid var(--border);cursor:pointer;} .customer-option:last-child{border-bottom:0}.customer-option:hover{background:#FBF5F2}.backup-row{display:flex;gap:8px;margin-top:10px}.backup-row .btn{flex:1}
  .more-item:last-child{ border-bottom:none; }
  .more-icon{ width:38px; height:38px; border-radius:12px; background:#FCEEE6; display:flex; align-items:center; justify-content:center; color:var(--primary-dark); flex-shrink:0; }
  .more-icon svg{ width:19px; height:19px; }
  .more-item .desc{ font-size:13px; color:var(--muted); margin-top:2px; }
  .more-dot{ width:8px; height:8px; border-radius:50%; background:var(--danger); flex-shrink:0; }
  .item-dot{ width:8px; height:8px; border-radius:50%; background:var(--danger); display:inline-block; margin-left:6px; box-shadow:0 0 0 2px #fff; vertical-align:middle; }
  .notification-center{ background:#fff; border:1px solid var(--border); border-radius:16px; padding:12px 14px; margin-bottom:12px; box-shadow:var(--shadow); }
  .notification-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;}
  .notification-count{background:var(--danger);color:#fff;border-radius:20px;padding:3px 8px;font-size:11px;font-weight:800;}
  .notification-item{display:flex;align-items:center;gap:9px;padding:10px 2px;border-bottom:1px solid var(--border);cursor:pointer;}
  .notification-item:last-child{border-bottom:0;}
  .notification-item .ni-dot{width:8px;height:8px;border-radius:50%;background:var(--danger);flex-shrink:0;}
  .system-notice-btn{background:rgba(255,255,255,.16);color:#fff;border:1px solid rgba(255,255,255,.35);border-radius:10px;padding:6px 9px;font-family:inherit;font-size:11px;font-weight:700;cursor:pointer;margin-top:10px;}
  .romance-card{ background:linear-gradient(135deg,#FFF4F6,#FFF9F2); border:1px solid #F1D7DD; }
  .romance-text{ font-size:14px; font-weight:700; line-height:2; text-align:center; color:var(--primary-dark); }
  .romance-actions{ display:flex; gap:8px; margin-top:10px; }
  .romance-actions .btn{ flex:1; }
  .toast{ position:fixed; bottom:24px; left:50%; transform:translateX(-50%); background: var(--text); color:#fff;
    padding:10px 18px; border-radius:20px; font-size:12.5px; z-index:100; opacity:0; transition:.25s; pointer-events:none; max-width:80%; text-align:center; }
  .toast.show{ opacity:1; }
  .offer-card{ background: linear-gradient(135deg, #FFF7F1, #FCEEE6); border:1px dashed var(--gold); }
  .offer-card .discount{ font-size:20px; font-weight:800; color:var(--primary-dark); }
  .del-x{ background:none;border:none;color:var(--danger);font-size:16px;cursor:pointer;padding:2px 6px; }
  .loading{ text-align:center; padding:60px 10px; color:var(--muted); font-size:13px; }
  .chips{ display:flex; gap:6px; margin-bottom:12px; flex-wrap:wrap; }
  .chip{ padding:6px 12px; border-radius:16px; font-size:11.5px; font-weight:700; border:1.5px solid var(--border);
    background:#fff; color:var(--muted); cursor:pointer; }
  .chip.active{ background: var(--primary); color:#fff; border-color:var(--primary); }
  .datesel{ display:flex; gap:6px; }
  .datesel select{ padding:8px 6px; font-size:12px; }
  .financial-stat{ text-align:center; padding:14px 6px; border-radius:14px; }
  .financial-stat .num{ font-size:17px; font-weight:800; }
  .financial-stat .lbl{ font-size:10.5px; color:var(--muted); margin-top:2px; }
  .settings-card{ background:#FFF7F1; border:1px solid var(--gold); border-radius:14px; padding:12px 14px; margin-bottom:14px; }
  .svc-check{ display:flex; align-items:center; justify-content:space-between; padding:9px 2px; border-bottom:1px solid var(--border); font-size:12.5px; cursor:pointer; }
  .svc-check:last-child{ border-bottom:none; }
  .svc-left{ display:flex; align-items:center; gap:8px; }
  .svc-left input{ width:auto; accent-color:var(--primary); }
  .svc-price{ color:var(--muted); font-size:11.5px; }
  .total-row{ display:flex; justify-content:space-between; align-items:center; padding:10px 2px 2px; font-size:13px; font-weight:700; }
  ::-webkit-scrollbar{ width:5px; height:4px; }
  ::-webkit-scrollbar-thumb{ background: var(--border); border-radius:10px; }
</style>
</head>
<body>

<div class="phone">
  <header class="top">
    <h1>سالن ناخن</h1>
    <p>مدیریت مشتری‌ها، وقت‌دهی و امور مالی</p>
    <button class="system-notice-btn" id="enableNotificationsBtn" onclick="requestSystemNotifications()">🔔 فعال‌سازی اعلان‌های گوشی</button>
    <div class="swatches">
      <span style="background:#B34760"></span><span style="background:#C79A4B"></span>
      <span style="background:#E8A0AE"></span><span style="background:#4C8C6B"></span><span style="background:#8C3349"></span>
    </div>
  </header>

  <main id="main"><div class="loading">در حال بارگذاری...</div></main>

  <button class="fab" id="fabBtn" title="افزودن">＋</button>

  <nav class="bottom" id="bottomNav">
    <button data-tab="home" class="active">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>
      <span class="nav-dot" id="dot_home"></span>
      <span class="tlabel">خانه</span>
    </button>
    <button data-tab="customers">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>
      <span class="nav-dot" id="dot_customers"></span>
      <span class="tlabel">مشتری‌ها</span>
    </button>
    <button data-tab="calendar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
      <span class="nav-dot" id="dot_calendar"></span>
      <span class="tlabel">تقویم</span>
    </button>
    <button data-tab="more">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg>
      <span class="nav-dot" id="dot_more"></span>

</div>

<div class="modal-overlay" id="modalOverlay"><div class="modal" id="modalBody"></div></div>
<div class="toast" id="toast"></div>
<input id="globalBackupFileInput" type="file" accept="application/json,.json" style="display:none">

<script>
/* ============ Jalali (Persian) calendar conversion ============ */
function jdiv(a,b){ return ~~(a/b); }
function jmod(a,b){ return a - ~~(a/b)*b; }
function jalCal(jy){
  var breaks=[-61,9,38,199,426,686,756,818,1111,1181,1210,1635,2060,2097,2192,2262,2324,2394,2456,3178];
  var bl=breaks.length, gy=jy+621, leapJ=-14, jp=breaks[0], jm,jump,leap,n,i,leapG,march;
  for(i=1;i<bl;i+=1){ jm=breaks[i]; jump=jm-jp; if(jy<jm) break;
    leapJ=leapJ+jdiv(jump,33)*8+jdiv(jmod(jump,33),4); jp=jm; }
  n=jy-jp; leapJ=leapJ+jdiv(n,33)*8+jdiv(jmod(n,33)+3,4);
  if(jmod(jump,33)===4 && jump-n===4) leapJ+=1;
  leapG=jdiv(gy,4)-jdiv((jdiv(gy,100)+1)*3,4)-150;
  march=20+leapJ-leapG;
  if(jump-n<6) n=n-jump+jdiv(jump+4,33)*33;
  leap=jmod(jmod(n+1,33)-1,4); if(leap===-1) leap=4;
  return {leap:leap, gy:gy, march:march};
}
function isLeapJalaaliYear(jy){ return jalCal(jy).leap===0; }
function g2d(gy,gm,gd){
  var d=jdiv((gy+jdiv(gm-8,6)+100100)*1461,4)+jdiv(153*jmod(gm+9,12)+2,5)+gd-34840408;
  d=d-jdiv(jdiv(gy+100100+jdiv(gm-8,6),100)*3,4)+752; return d;
}
function d2g(jdn){
  var j,i,gd,gm,gy;
  j=4*jdn+139361631;
  j=j+jdiv(jdiv(4*jdn+183187720,146097)*3,4)*4-3908;
  i=jdiv(jmod(j,1461),4)*5+308;
  gd=jdiv(jmod(i,153),5)+1;
  gm=jmod(jdiv(i,153),12)+1;
  gy=jdiv(j,1461)-100100+jdiv(8-gm,6);
  return [gy,gm,gd];
}
function j2d(jy,jm,jd){ var r=jalCal(jy); return g2d(r.gy,3,r.march)+(jm-1)*31-jdiv(jm,7)*(jm-7)+jd-1; }
function d2j(jdn){
  var gy=d2g(jdn)[0], jy=gy-621, r,jdn1f,k,jm,jd;
  r=jalCal(jy); jdn1f=g2d(gy,3,r.march); k=jdn-jdn1f;
  if(k>=0){ if(k<=185){ jm=1+jdiv(k,31); jd=jmod(k,31)+1; return [jy,jm,jd]; } else { k-=186; } }
  else { jy-=1; k+=179; if(r.leap===1) k+=1; }
  jm=7+jdiv(k,30); jd=jmod(k,30)+1; return [jy,jm,jd];
}
function toJalaali(gy,gm,gd){ return d2j(g2d(gy,gm,gd)); }
function toGregorian(jy,jm,jd){ return d2g(j2d(jy,jm,jd)); }
function daysInJalaaliMonth(jy,jm){ if(jm<=6) return 31; if(jm<=11) return 30; return isLeapJalaaliYear(jy)?30:29; }

const FA_MONTHS = ['فروردین','اردیبهشت','خرداد','تیر','مرداد','شهریور','مهر','آبان','آذر','دی','بهمن','اسفند'];
const FA_WEEKDAYS = ['یکشنبه','دوشنبه','سه‌شنبه','چهارشنبه','پنجشنبه','جمعه','شنبه'];
function toFa(n){ return String(n).replace(/\d/g, d => '۰۱۲۳۴۵۶۷۸۹'[d]); }
function pad2(n){ return String(n).padStart(2,'0'); }

function isoFromParts(gy,gm,gd){ return gy+'-'+pad2(gm)+'-'+pad2(gd); }
function partsFromIso(iso){ const [y,m,d]=iso.split('-').map(Number); return [y,m,d]; }
function isoToJalali(iso){ const [y,m,d]=partsFromIso(iso); return toJalaali(y,m,d); }
function todayIso(){ const d=new Date(); return isoFromParts(d.getFullYear(), d.getMonth()+1, d.getDate()); }
function todayJalali(){ return isoToJalali(todayIso()); }

function formatJalali(iso, withWeekday){
  if(!iso) return '';
  const [jy,jm,jd] = isoToJalali(iso);
  const [gy,gm,gd] = partsFromIso(iso);
  const wd = FA_WEEKDAYS[new Date(gy,gm-1,gd).getDay()];
  let s = toFa(jd) + ' ' + FA_MONTHS[jm-1] + ' ' + toFa(jy);
  if(withWeekday) s = wd + '، ' + s;
  return s;
}
function formatJalaliShort(iso){
  if(!iso) return '';
  const [jy,jm,jd] = isoToJalali(iso);
  return toFa(jd) + ' ' + FA_MONTHS[jm-1] + ' ' + toFa(String(jy).slice(2));
}
function daysBetween(iso1, iso2){
  const d1 = new Date(iso1+'T00:00:00'), d2 = new Date(iso2+'T00:00:00');
  return Math.round((d2-d1)/86400000);
}

/* Jalali date-select widget (day/month/year selects) */
function jalaliDateSelectsHtml(prefix, iso, yearsBack, yearsForward){
  yearsBack = yearsBack===undefined ? 3 : yearsBack;
  yearsForward = yearsForward===undefined ? 1 : yearsForward;
  const [jy,jm,jd] = iso ? isoToJalali(iso) : todayJalali();
  const curY = todayJalali()[0];
  let yearOpts = '';
  for(let y=curY-yearsBack; y<=curY+yearsForward; y++) yearOpts += `<option value="${y}" ${y===jy?'selected':''}>${toFa(y)}</option>`;
  let monthOpts = FA_MONTHS.map((n,i)=> `<option value="${i+1}" ${i+1===jm?'selected':''}>${n}</option>`).join('');
  const dim = daysInJalaaliMonth(jy,jm);
  let dayOpts = '';
  for(let d=1; d<=dim; d++) dayOpts += `<option value="${d}" ${d===jd?'selected':''}>${toFa(d)}</option>`;
  return `<div class="datesel">
    <select id="${prefix}_d">${dayOpts}</select>
    <select id="${prefix}_m">${monthOpts}</select>
    <select id="${prefix}_y">${yearOpts}</select>
  </div>`;
}
function getIsoFromJalaliSelects(prefix){
  const d = Number(document.getElementById(prefix+'_d').value);
  const m = Number(document.getElementById(prefix+'_m').value);
  const y = Number(document.getElementById(prefix+'_y').value);
  const [gy,gm,gd] = toGregorian(y,m,d);
  return isoFromParts(gy,gm,gd);
}

/* Month/day-only pickers for recurring occasions (no year) */
const G_MONTHS = ['ژانویه','فوریه','مارس','آوریل','مه','ژوئن','ژوئیه','اوت','سپتامبر','اکتبر','نوامبر','دسامبر'];
function monthDaySelectHtml(prefix, type, month, day){
  const names = type==='gregorian' ? G_MONTHS : FA_MONTHS;
  const m = month||1, d = day||1;
  let monthOpts = names.map((n,i)=>`<option value="${i+1}" ${i+1===m?'selected':''}>${n}</option>`).join('');
  let dayOpts = '';
  for(let dd=1; dd<=31; dd++) dayOpts += `<option value="${dd}" ${dd===d?'selected':''}>${type==='gregorian'?dd:toFa(dd)}</option>`;
  return `<div class="datesel"><select id="${prefix}_d">${dayOpts}</select><select id="${prefix}_m">${monthOpts}</select></div>`;
}

/* Birthday countdown */
function daysUntilNextBirthday(birthIso){
  if(!birthIso) return null;
  const [,bm,bd] = isoToJalali(birthIso);
  const [ty,tm,td] = todayJalali();
  let targetY = ty;
  if(tm>bm || (tm===bm && td>bd)) targetY = ty+1;
  const dim = daysInJalaaliMonth(targetY, bm);
  const day = Math.min(bd, dim);
  const [gy,gm,gd] = toGregorian(targetY, bm, day);
  return daysBetween(todayIso(), isoFromParts(gy,gm,gd));
}
function ageFromBirth(birthIso){
  if(!birthIso) return null;
  const [by] = isoToJalali(birthIso);
  const [ty] = todayJalali();
  return ty - by;
}

/* Occasions: next occurrence + job matching */
function nextOccasionDate(occ){
  const t = todayIso();
  if(occ.type==='jalali'){
    const [ty] = todayJalali();
    for(let y=ty; y<=ty+1; y++){
      const dim = daysInJalaaliMonth(y, occ.month);
      const day = Math.min(occ.day, dim);
      const [gy,gm,gd] = toGregorian(y, occ.month, day);
      const iso = isoFromParts(gy,gm,gd);
      if(iso >= t) return iso;
    }
  } else {
    const [gyToday] = partsFromIso(t);
    for(let y=gyToday; y<=gyToday+1; y++){
      const iso = isoFromParts(y, occ.month, occ.day);
      if(iso >= t) return iso;
    }
  }
  return null;
}
function matchedCustomersForOccasion(occ){
  if(!occ.jobKeywords || occ.jobKeywords.length===0) return [];
  return state.customers.filter(c=> c.job && occ.jobKeywords.some(k=>c.job.includes(k)));
}
function upcomingBirthdays(withinDays){
  return state.customers.filter(c=>c.birthDate)
    .map(c=>({c, days: daysUntilNextBirthday(c.birthDate)}))
    .filter(x=>x.days!==null && x.days<=withinDays)
    .sort((a,b)=>a.days-b.days);
}
function upcomingOccasions(withinDays){
  return state.occasions.map(o=>({o, next: nextOccasionDate(o)}))
    .filter(x=>x.next)
    .map(x=>({o:x.o, next:x.next, days: daysBetween(todayIso(), x.next)}))
    .filter(x=>x.days<=withinDays)
    .sort((a,b)=>a.days-b.days);
}

/* ============ Customer analytics helpers ============ */
function customerVisits(customerId){
  return state.appointments.filter(a=>a.customerId===customerId && a.status!=='cancelled').sort((a,b)=>a.date.localeCompare(b.date));
}
function lastVisitIso(customerId){
  const v = customerVisits(customerId);
  return v.length ? v[v.length-1].date : null;
}
function daysSinceLastVisit(customerId){
  const lv = lastVisitIso(customerId);
  if(!lv) return null;
  return daysBetween(lv, todayIso());
}
function smartFollowupCustomers(){
  return state.customers.map(c=>{
    const st=customerStats(c.id);
    const days=daysSinceLastVisit(c.id);
    if(days===null || st.avgGap===null) return null;
    const threshold=Math.max(30, st.avgGap+7);
    return {c, days, avgGap:st.avgGap, threshold, overdue:days-threshold};
  }).filter(Boolean).filter(x=>x.overdue>=0).sort((a,b)=>b.overdue-a.overdue);
}
function customerStats(customerId){
  const visits = customerVisits(customerId);
  const dates = visits.map(v=>v.date);
  const gaps = [];
  for(let i=1;i<dates.length;i++) gaps.push(daysBetween(dates[i-1], dates[i]));
  const avgGap = gaps.length ? Math.round(gaps.reduce((a,b)=>a+b,0)/gaps.length) : null;
  const servicesCount = {};
  visits.forEach(v=>{
    const svcs = (v.services && v.services.length) ? v.services : [{name: v.serviceName || 'نامشخص'}];
    svcs.forEach(s=>{ const n = s.name||'نامشخص'; servicesCount[n]=(servicesCount[n]||0)+1; });
  });
  const totalSpend = visits.reduce((sum,v)=>sum+(Number(v.price)||0),0);
  const avgTicket = visits.length ? Math.round(totalSpend/visits.length) : 0;
  return { visits, gaps, avgGap, servicesCount, totalVisits: visits.length, lastVisit: dates.length?dates[dates.length-1]:null, totalSpend, avgTicket };
}
function referralCount(customerId){
  return state.customers.filter(c=>c.referrerId===customerId).length;
}
function referralDiscountFor(customerId){
  const n = referralCount(customerId);
  const s = state.referralSettings;
  if(!s.perReferrals) return 0;
  return Math.floor(n / s.perReferrals) * s.discountPercent;
}

function appointmentReminderInfo(a){

  // اعلان نوبت فقط در بازه ۲۴ ساعت مانده تا شروع نوبت فعال است.
  if(diff < 0 || diff > 24*60*60*1000) return null;
  return {dt,diff};
}

function buildNotificationCandidates(){
  const out=[];

  // ۱) نوبت: فقط از ۲۴ ساعت قبل تا لحظه شروع نوبت
  state.appointments.forEach(a=>{
    const info = appointmentReminderInfo(a);
    if(!info) return;
    const k = notificationKey('appointment', a.id, a.date+' '+a.time);
    const hours = Math.max(0, Math.ceil(info.diff/(60*60*1000)));
    const timing = hours <= 1 ? 'تا شروع نوبت کمتر از یک ساعت مانده' : `${toFa(hours)} ساعت تا نوبت مانده`;
    out.push({
      id:k, type:'appointment', tab:'calendar',
      title:`نوبت ${a.customerName||'مشتری'} نزدیک است`,
      text:`${formatJalaliShort(a.date)} · ${a.time} · ${a.serviceName||'خدمت'} · ${timing}`,
      actionId:a.id
    });
  });

  // ۲) تولد: از ۷ روز قبل؛ شناسه بر اساس تولد همان سال است
  upcomingBirthdays(7).forEach(x=>{
    const k=birthdayReminderKey(x.c); if(!k) return;
    out.push({
      id:notificationKey('birthday',x.c.id,k),
      type:'birthday', tab:'home',
      title:`تولد ${x.c.name} نزدیک است`,
      text:x.days===0?'امروز تولدشه 🎂':`${toFa(x.days)} روز تا تولد 🎂`,
      actionId:x.c.id
    });
  });

  // ۳) مناسبت: از ۷ روز قبل؛ شناسه بر اساس تاریخ همان سال است
  upcomingOccasions(7).forEach(x=>{
    const k=occasionReminderKey(x.o); if(!k) return;
    out.push({
      id:notificationKey('occasion',x.o.id,k),
      type:'occasion', tab:'occasions',
      title:`${x.o.title} نزدیک است`,
      text:x.days===0?'امروز':`${toFa(x.days)} روز مانده`,
      actionId:x.o.id
    });
  });

  // ۴) پیگیری: وقتی از زمان معمول مراجعه مشتری عبور کرده باشد
  smartFollowupCustomers().slice(0,20).forEach(x=>{
    const k=notificationKey('followup',x.c.id,lastVisitIso(x.c.id)||'');
    out.push({
      id:k, type:'followup', tab:'customers',
      title:`وقت پیگیری ${x.c.name} رسیده`,
      text:`${toFa(x.days)} روز از آخرین مراجعه گذشته`,
      actionId:x.c.id
    });
  });

  // ۵) تخفیف: با تغییر درصد تخفیف، شناسه جدید و اعلان جدید ایجاد می‌شود
  state.customers.filter(c=>referralDiscountFor(c.id)>0).forEach(c=>{
    const discount = referralDiscountFor(c.id);
    const k=notificationKey('offer',c.id,String(discount));
    out.push({
      id:k, type:'offer', tab:'offers',
      title:`${c.name} واجد تخفیف شده`,
      text:`${toFa(discount)}٪ تخفیف معرفی`,
      actionId:c.id
    });
  });

  return out;
}

function syncNotifications(){
  const candidates=buildNotificationCandidates();
  const candidateIds=new Set(candidates.map(n=>n.id));
  const existing=new Map((Array.isArray(state.notifications)?state.notifications:[]).map(n=>[n.id,n]));
  let changed=false;

  candidates.forEach(n=>{
    const old=existing.get(n.id);
    if(!old){
      existing.set(n.id,{...n,read:false,createdAt:new Date().toISOString()});
      changed=true;
      return;
    }

    // اطلاعات پویا مثل «۳ روز مانده» یا ساعت نوبت باید به‌روز شود،
    // ولی read و createdAt هرگز با رندر مجدد ریست نمی‌شوند.
    const updated={...old, ...n, read:!!old.read, createdAt:old.createdAt||new Date().toISOString()};
    if(JSON.stringify(updated)!==JSON.stringify(old)){
      existing.set(n.id,updated);
      changed=true;
    }
  });

  // اعلان خوانده‌شده فقط تا وقتی رویداد واقعاً فعال است نگه داشته می‌شود.
  // اعلان خوانده‌نشده حتی اگر موقتاً از بازه فعال خارج شود، حذف نمی‌شود
  // تا کاربر فرصت دیدن آن را داشته باشد.
  const next=[...existing.values()].filter(n=>candidateIds.has(n.id) || !n.read);

  if(next.length!==state.notifications.length ||
     next.some((n,i)=>JSON.stringify(n)!==JSON.stringify(state.notifications[i]))) changed=true;

  state.notifications=next;
  if(changed) storageSet('notifications',state.notifications);
}

  '؛ امیر هر روز بیشتر عاشقت میشه ❤️',
  '؛ امیر دلش می‌خواد همیشه کنارت باشه 🥰❤️',
  '؛ تو قشنگ‌ترین آدم دنیای امیری 💕',
  '؛ امیر با فکر تو لبخند می‌زنه 🫶🏻💗'
];
// 200 پیام با ترتیب درهم‌ریخته؛ دیگر چهار نسخه از یک جمله پشت سر هم نمی‌آید.
const ROMANTIC_MESSAGES = ROMANCE_A.flatMap(a=>ROMANCE_B.map(b=>a+b));
// ترتیب را به‌صورت ثابت درهم می‌ریزیم تا هر بار برنامه باز می‌شود ترتیب عوض نشود.
(function shuffleRomance(){
  let seed=20260826;
  const rand=()=>{ seed=(seed*1664525+1013904223)>>>0; return seed/4294967296; };
  for(let i=ROMANTIC_MESSAGES.length-1;i>0;i--){ const j=Math.floor(rand()*(i+1)); [ROMANTIC_MESSAGES[i],ROMANTIC_MESSAGES[j]]=[ROMANTIC_MESSAGES[j],ROMANTIC_MESSAGES[i]]; }
  // اگر دو پیام پشت‌سرهم از یک متن اصلی باشند، جایشان را با بعدی عوض می‌کنیم.
  for(let i=1;i<ROMANTIC_MESSAGES.length;i++){
    const base=x=>x.split('؛ امیر')[0];
    if(base(ROMANTIC_MESSAGES[i])===base(ROMANTIC_MESSAGES[i-1])){
      const j=ROMANTIC_MESSAGES.findIndex((x,k)=>k>i+1 && base(x)!==base(ROMANTIC_MESSAGES[i-1]));
      if(j>0) [ROMANTIC_MESSAGES[i],ROMANTIC_MESSAGES[j]]=[ROMANTIC_MESSAGES[j],ROMANTIC_MESSAGES[i]];
    }
  }
})();
function dayOfYear(){
  const d=new Date();
  return Math.floor((Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())-Date.UTC(d.getFullYear(),0,0))/86400000);
}
function currentRomanceIndex(){
  return state.romanceIndex===null ? dayOfYear()%ROMANTIC_MESSAGES.length : state.romanceIndex%ROMANTIC_MESSAGES.length;
}
async function nextRomance(){
  const current=currentRomanceIndex();
  let next=current;
  // هر بار یک پیام متفاوت انتخاب کن؛ حداقل تا تمام شدن چرخه، پیام قبلی دوباره نمی‌آید.
  const recent=Array.isArray(state.romanceHistory)?state.romanceHistory:[];
  const blocked=new Set(recent.slice(-24));
  const candidates=[];
  for(let i=0;i<ROMANTIC_MESSAGES.length;i++) if(i!==current && !blocked.has(i)) candidates.push(i);
  if(!candidates.length){
    for(let i=0;i<ROMANTIC_MESSAGES.length;i++) if(i!==current) candidates.push(i);
    state.romanceHistory=[];
  }
  next=candidates[Math.floor(Math.random()*candidates.length)];
  state.romanceIndex=next;
  state.romanceHistory=[...(state.romanceHistory||[]),next].slice(-24);
  await storageSet('romanceIndex', state.romanceIndex);
  await storageSet('romanceHistory', state.romanceHistory);
  render();
}

function exportBackup(){
  try{
    const backup={version:2,app:'nailapp',createdAt:new Date().toISOString(),data:{}};
    for(let i=0;i<localStorage.length;i++){
      const k=localStorage.key(i);
      if(k && k.startsWith(STORAGE_PREFIX)){
        const shortKey=k.slice(STORAGE_PREFIX.length);
        try{ backup.data[shortKey]=JSON.parse(localStorage.getItem(k)); }
        catch(e){ backup.data[shortKey]=localStorage.getItem(k); }
      }
    }
    const blob=new Blob([JSON.stringify(backup,null,2)],{type:'application/json;charset=utf-8'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url; a.download='backup-salon-nail.json';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),1000);
    showToast('بکاپ با موفقیت ساخته شد');
  }catch(err){ console.error(err); showToast('ساخت بکاپ انجام نشد'); }
}
function importBackup(){
  const input=document.getElementById('globalBackupFileInput');
  if(!input){ showToast('ابزار بازیابی در دسترس نیست'); return; }
  input.value='';
  input.click();
}
function handleBackupFile(input){
  const file=input.files&&input.files[0]; if(!file) return;
  const reader=new FileReader();
  reader.onload=async e=>{
    try{
      const backup=JSON.parse(e.target.result);
      if(!backup || backup.app!=='nailapp' || !backup.data || typeof backup.data!=='object') throw new Error('invalid');
      const keys=Object.keys(backup.data);
      if(!keys.length) throw new Error('empty');
      if(!confirm('اطلاعات فعلی با این نسخه پشتیبان جایگزین شود؟')) return;
      keys.forEach(k=>localStorage.setItem(STORAGE_PREFIX+k,JSON.stringify(backup.data[k])));
      showToast('بازیابی با موفقیت انجام شد');
      setTimeout(()=>location.reload(),700);
    }catch(err){ console.error(err); showToast('فایل پشتیبان معتبر نیست'); }
    input.value='';
  };
  reader.readAsText(file);
}

function renderCustList(query){
  const q = (query||'').trim();
  let filtered = state.customers.filter(c=> c.name.includes(q) || (c.phone||'').includes(q));
  if(state.custFilter==='30') filtered = filtered.filter(c=>{ const d=daysSinceLastVisit(c.id); return d!==null && d>=30 && d<40; });
  if(state.custFilter==='40') filtered = filtered.filter(c=>{ const d=daysSinceLastVisit(c.id); return d!==null && d>=40; });
  if(state.custSort==='name') filtered.sort((a,b)=>a.name.localeCompare(b.name,'fa'));
  else filtered.sort((a,b)=>{
    const da=daysSinceLastVisit(a.id), db=daysSinceLastVisit(b.id);
    if(da===null && db===null) return 0; if(da===null) return 1; if(db===null) return -1;
    return db-da;

function jalaliSearchToIso(value){
  const raw = String(value||'').trim().replace(/[۰-۹]/g, d => '۰۱۲۳۴۵۶۷۸۹'.indexOf(d)).replace(/[-.\s]+/g,'/');
  const m = raw.match(/^(\d{4})[\/]?(\d{1,2})[\/]?(\d{1,2})$/);
  if(!m) return null;
  const jy=Number(m[1]), jm=Number(m[2]), jd=Number(m[3]);
  if(jm<1 || jm>12 || jd<1 || jd>daysInJalaaliMonth(jy,jm)) return null;
  const [gy,gm,gd]=toGregorian(jy,jm,jd);
  return isoFromParts(gy,gm,gd);
}

function monthlyServiceCounts(jy){
  const result=[];
  for(let m=1;m<=12;m++){
    const counts={};
    state.appointments.filter(a=>a.status==='done').forEach(a=>{
      const [ay,am]=isoToJalali(a.date);
      if(ay!==jy || am!==m) return;
      const svcs=(a.services&&a.services.length)?a.services:[{name:a.serviceName||'نامشخص'}];
      svcs.forEach(s=>{
        const name=s.name||'نامشخص';
        counts[name]=(counts[name]||0)+1;
      });
    });
    result.push({month:m, counts});
  }
  return result;
}

function recalcApptTotal(){
  const checked = [...document.querySelectorAll('.svcCk:checked')];
  const total = checked.reduce((sum,c)=>sum+Number(c.dataset.price||0),0);
  document.getElementById('fPrice').value = total;
}
function openAppointmentForm(id, presetCustomerId){
  const a = id ? state.appointments.find(x=>x.id===id) : null;
  const selectedIds = a ? (a.services||[]).map(s=>s.serviceId) : [];
  const selectedCustomerId = a ? a.customerId : (presetCustomerId || '');
  const selectedCustomer = state.customers.find(c=>c.id===selectedCustomerId);
  openModal(`
    <h3>${a?'ویرایش نوبت':'نوبت جدید'}</h3>
    <label>مشتری</label>
    <div class="customer-picker">
      <input type="hidden" id="fCustomer" value="${selectedCustomerId}">
      <input id="fCustomerSearch" autocomplete="off" placeholder="نام مشتری را جستجو کن..." value="${selectedCustomer?escapeHtml(selectedCustomer.name):''}">
      <div id="customerPickerResults" class="customer-picker-results"></div>
    </div>
    <label>خدمات (می‌تونی چند مورد با هم انتخاب کنی)</label>
    <div class="card" id="svcChecklist" style="margin-top:0;">${serviceChecklistHtml(selectedIds)}</div>
    <label>تاریخ</label>
    ${jalaliDateSelectsHtml('fDate', a?a.date:todayIso())}
    <label>ساعت</label>
    <input type="time" id="fTime" value="${a?a.time:''}">
    <label>مبلغ نهایی (تومان) — خودکار جمع می‌زنه، در صورت نیاز ویرایش کن</label>
    <input type="number" id="fPrice" min="0" value="${a?a.price||'':''}" placeholder="مبلغ">
    <div class="modal-actions">
      <button class="btn ghost" onclick="closeModal()">انصراف</button>
      <button class="btn" onclick="saveAppointment('${a?a.id:''}')">ذخیره</button>
    </div>
  `);
  const customerSearch = document.getElementById('fCustomerSearch');
  const customerResults = document.getElementById('customerPickerResults');
  function renderCustomerResults(query=''){
    const q=query.trim().toLocaleLowerCase();
    const matches=state.customers.filter(c=>!q || c.name.toLocaleLowerCase().includes(q) || String(c.phone||'').includes(q)).slice(0,50);
    customerResults.innerHTML=matches.length ? matches.map(c=>`<div class="customer-option" onclick="selectAppointmentCustomer('${c.id}')"><b>${escapeHtml(c.name)}</b>${c.phone?`<div class="sub">${escapeHtml(c.phone)}</div>`:''}</div>`).join('') : '<div class="muted" style="padding:12px">مشتری پیدا نشد</div>';
    customerResults.classList.add('open');
  }
  customerSearch.addEventListener('focus',()=>renderCustomerResults(customerSearch.value));
  customerSearch.addEventListener('input',()=>{ document.getElementById('fCustomer').value=''; renderCustomerResults(customerSearch.value); });
  document.addEventListener('click', function closeCustomerPicker(e){ if(!e.target.closest('.customer-picker')) customerResults.classList.remove('open'); }, {once:true});
  const checklistEl = document.getElementById('svcChecklist');
  checklistEl.addEventListener('change', recalcApptTotal);
  if(!a) recalcApptTotal();
}
function selectAppointmentCustomer(id){
  const c=state.customers.find(x=>x.id===id); if(!c) return;
  document.getElementById('fCustomer').value=id;
  document.getElementById('fCustomerSearch').value=c.name;
  document.getElementById('customerPickerResults').classList.remove('open');
}
async function saveAppointment(id){
  const customerId = document.getElementById('fCustomer').value;
  const date = getIsoFromJalaliSelects('fDate');
  const time = document.getElementById('fTime').value;
  const priceInput = document.getElementById('fPrice').value;
  const checked = [...document.querySelectorAll('.svcCk:checked')];
  if(!customerId){ showToast('مشتری را انتخاب کن'); return; }
  if(!time){ showToast('ساعت را وارد کن'); return; }
  if(checked.length===0){ showToast('حداقل یک خدمت رو انتخاب کن'); return; }
  const services = checked.map(c=>({ serviceId:c.value, name:c.dataset.name, price:Number(c.dataset.price)||0 }));
  const serviceName = services.map(s=>s.name).join('، ');
  const autoTotal = services.reduce((s,x)=>s+x.price,0);
  const price = priceInput!=='' ? Number(priceInput) : autoTotal;
  const customer = state.customers.find(c=>c.id===customerId);
  const conflict = state.appointments.find(x=>x.id!==id && x.date===date && x.time===time && x.status!=='cancelled');
  if(conflict){ showToast('⚠️ در این ساعت یک نوبت دیگر ثبت شده'); return; }
  if(id){
    const a = state.appointments.find(x=>x.id===id);
    Object.assign(a, { customerId, customerName: customer.name, services, serviceName, date, time, price });
  } else {
    state.appointments.push({ id: uid(), customerId, customerName: customer.name, services, serviceName, date, time, price, status:'upcoming' });
  }
  await storageSet('appointments', state.appointments);
  closeModal(); render(); showToast('نوبت ذخیره شد');
}
function openAppointmentActions(id){
  const a = state.appointments.find(x=>x.id===id);
  if(!a) return;
  const c = state.customers.find(c=>c.id===a.customerId);
  openModal(`
    <h3>${c?escapeHtml(c.name):'نوبت'}</h3>
    <p class="sub" style="margin-top:4px;">${formatJalaliShort(a.date)} — ${a.time} · ${escapeHtml(a.serviceName||'')}</p>
    <div class="modal-actions">
      <button class="btn ghost" onclick="closeModal(true); openAppointmentForm('${a.id}')">ویرایش</button>
      <button class="btn" onclick="copyReminder('${a.id}')">پیام یادآوری</button>
    </div>
    <div class="modal-actions">
      <button class="btn ghost" onclick="setApptStatus('${a.id}','done')">انجام‌شد ✓</button>
      <button class="btn ghost" onclick="setApptStatus('${a.id}','cancelled')">کنسل شد</button>
    </div>
    <button class="del-x" style="margin-top:10px;" onclick="deleteAppointment('${a.id}')">حذف نوبت</button>
  `);
}
async function setApptStatus(id, status){
  const a = state.appointments.find(x=>x.id===id); a.status = status;
  await storageSet('appointments', state.appointments);
  closeModal(); render();
}
async function deleteAppointment(id){
  if(!confirm('این نوبت حذف بشه؟')) return;
  state.appointments = state.appointments.filter(a=>a.id!==id);
  await storageSet('appointments', state.appointments);

function copyReminder(id){
  const a = state.appointments.find(x=>x.id===id);
  const c = state.customers.find(c=>c.id===a.customerId);
  const msg = `سلام ${c?c.name:''} عزیز 🌸 یادآوری وقت شما در تاریخ ${formatJalali(a.date)} ساعت ${a.time} برای ${a.serviceName||'خدمت رزرو‌شده'}. منتظر دیدارتون هستیم 💅`;

    <p class="muted" style="line-height:1.8;margin-bottom:8px;">می‌تونی از <b>{name}</b> برای نام مشتری، <b>{occasion}</b> برای نام مناسبت و <b>{date}</b> برای تاریخ استفاده کنی.</p>
    <label>متن تبریک تولد</label>
    <textarea id="fBirthdayTpl" rows="5">${escapeHtml(state.smsTemplates.birthday)}</textarea>
    <label>متن پیش‌فرض مناسبت‌ها</label>
    <textarea id="fOccasionTpl" rows="5">${escapeHtml(state.smsTemplates.occasion)}</textarea>
    <div class="modal-actions">
      <button class="btn ghost" onclick="closeModal()">انصراف</button>
      <button class="btn" onclick="saveSmsSettings()">ذخیره</button>
    </div>
  `);
}
async function saveSmsSettings(){
  state.smsTemplates.birthday=document.getElementById('fBirthdayTpl').value.trim() || state.smsTemplates.birthday;
  state.smsTemplates.occasion=document.getElementById('fOccasionTpl').value.trim() || state.smsTemplates.occasion;
  await storageSet('smsTemplates',state.smsTemplates);
  closeModal(); render(); showToast('متن پیامک‌ها ذخیره شد');
}

/* ============ Materials ============ */
function openMaterialForm(){
  const existingNames = [...new Set(state.materials.map(m=>m.name))];
  openModal(`
    <h3>ثبت خرید مواد اولیه</h3>
    <label>نام ماده</label>
    <input id="fMatName" list="matNames" placeholder="مثلاً پودر آکریلیک">
    <datalist id="matNames">${existingNames.map(n=>`<option value="${escapeHtml(n)}">`).join('')}</datalist>
    <label>قیمت خرید (تومان)</label>
    <input type="number" id="fMatPrice" min="0" placeholder="مبلغ">
    <label>تاریخ خرید</label>
    ${jalaliDateSelectsHtml('fMatDate', todayIso())}
    <label>این خرید برای چند مشتری کافیه؟ (اختیاری)</label>
    <input type="number" id="fMatCustomers" min="1" placeholder="مثلاً ۱۵">
    <p class="muted" style="margin-top:6px;">برای محاسبه قیمت تمام‌شده مواد به ازای هر مشتری، این مقدار رو وارد کن.</p>
    <div class="modal-actions">
      <button class="btn ghost" onclick="closeModal()">انصراف</button>
      <button class="btn" onclick="saveMaterial()">ذخیره</button>
    </div>
  `);
}
async function saveMaterial(){
  const name = document.getElementById('fMatName').value.trim();
  const price = Number(document.getElementById('fMatPrice').value) || 0;
  const date = getIsoFromJalaliSelects('fMatDate');
  const customersServedRaw = document.getElementById('fMatCustomers').value;
  const customersServed = customersServedRaw ? Number(customersServedRaw) : null;
  if(!name || !price){ showToast('نام ماده و قیمت را وارد کن'); return; }
  state.materials.push({ id: uid(), name, price, date, customersServed });
  await storageSet('materials', state.materials);
  closeModal(); render(); showToast('خرید ثبت شد');
}
async function deleteMaterial(id){
  if(!confirm('این خرید حذف بشه؟')) return;
  state.materials = state.materials.filter(m=>m.id!==id);
  await storageSet('materials', state.materials);
  render(); showToast('حذف شد');
}

/* ============ Expenses / financial report ============ */

    <label>عنوان</label><input id="fExpTitle" placeholder="مثلاً اجاره مغازه شهریور">

    <select id="fExpCat">
      <option value="rent">اجاره</option>
      <option value="tools">ابزار</option>

    <div class="modal-actions">
      <button class="btn ghost" onclick="closeModal()">انصراف</button>
      <button class="btn" onclick="saveExpense()">ذخیره</button>

  `);
}
async function saveExpense(){
  const title = document.getElementById('fExpTitle').value.trim();
  const category = document.getElementById('fExpCat').value;
  const amount = Number(document.getElementById('fExpAmount').value) || 0;
  const date = getIsoFromJalaliSelects('fExpDate');
  if(!title || !amount){ showToast('عنوان و مبلغ را وارد کن'); return; }
  state.expenses.push({ id: uid(), title, category, amount, date });
  await storageSet('expenses', state.expenses);
  closeModal(); render(); showToast('هزینه ثبت شد');
}
async function deleteExpense(id){
  if(!confirm('این هزینه حذف بشه؟')) return;
  state.expenses = state.expenses.filter(e=>e.id!==id);
  await storageSet('expenses', state.expenses);
  render(); showToast('حذف شد');
}

document.getElementById('globalBackupFileInput').addEventListener('change', function(){ handleBackupFile(this); });

/* ============ Init ============ */
(async function init(){
  try{
    await loadAll();
    const lastTab = await storageGet('lastTab');
    if(lastTab && VALID_TABS.includes(lastTab)) state.tab = lastTab;
    history.replaceState({nailapp:true,tab:state.tab},'',location.href);
    history.pushState({nailapp:true,tab:state.tab},'',location.href);
    window.addEventListener('popstate',e=>{
      if(modalHistoryOpen){
        handlingPopState=true;
        modalHistoryOpen=false;
        closeModal(true);
        handlingPopState=false;
        return;
      }
      if(e.state && e.state.nailapp){
        handlingPopState=true;
        state.tab=e.state.tab||'home';
        render();
        handlingPopState=false;
      } else {
        history.pushState({nailapp:true,tab:state.tab},'',location.href);
      }
    });
    // render خودش اعلان‌ها را همگام می‌کند؛ رندر دوم و sync تکراری حذف شد.
    render();
    updateNotificationButton();
  }catch(err){
    console.error('NailApp initialization failed:', err);
    state.loaded=false;
    const main=document.getElementById('main');
    if(main) main.innerHTML='<div class="loading">خطا در بارگذاری اطلاعات.<br><button class="btn" style="margin-top:12px" onclick="location.reload()">تلاش دوباره</button></div>';
  }
})();
// PWA: register the offline shell service worker when available.
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(err => console.warn('PWA service worker registration failed:', err));
  });
}
